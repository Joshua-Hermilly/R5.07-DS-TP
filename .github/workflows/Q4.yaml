name: Q4
on:
  workflow_dispatch:
  push:
    paths:
      - Q4.java
      - .github/workflows/Q4.yaml
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Création de l'archive datée
        run: |
          fichier="Q4_archive_$(date +%d-%m-%Y).txt"
          {
            echo "Joshua HERMILLY"
            cat Q4.java
          } > "$fichier"
          echo "FICHIER=$fichier" >> "$GITHUB_ENV"
      - name: Commit et push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add "$FICHIER"
          git commit -m "Q4 : $FICHIER" || echo "rien à commiter"
          git pull --rebase
          git push
