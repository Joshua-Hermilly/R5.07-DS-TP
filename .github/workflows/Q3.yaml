name: Q3
on:
  workflow_dispatch:
  push:
    paths:
      - Q3.java
      - .github/workflows/Q3.yaml
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Création de l'archive
        run: |
          {
            echo "Joshua HERMILLY"
            cat Q3.java
          } > Q3_archive_jav.txt
      - name: Commit et push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add Q3_archive_java.txt
          git commit -m "Q3 : archive de Q3.java" || echo "rien à commiter"
          git pull --rebase
          git push
